<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agenda RG Ópticas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root{--navy:#0A192F;--navy2:#172A45;--gold:#D4AF37;--gold2:#B08D28;--bg:#F4F1EA;--card:#fff;--ink:#0F172A;--mute:#64748B;--line:#E2DDD0;--ok:#047857;--bad:#B91C1C;--warn:#B45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
header{background:var(--navy);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.35rem;font-weight:700;letter-spacing:.3px}
.sub{font-size:.82rem;color:#B6C2D6;margin-top:2px}
.icons button{background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.05rem;margin-left:8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 54px;text-align:center;padding:8px 0;border-radius:14px;background:rgba(255,255,255,.07);color:#cbd5e1;border:0;font-family:inherit}
.day small{display:block;font-size:.68rem}.day b{font-size:1.1rem;color:#fff}
.day.sel{background:var(--gold);color:var(--navy)}.day.sel b{color:var(--navy)}
.day i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}.day.has i{background:var(--gold)}.day.sel.has i{background:var(--navy)}
main{padding:16px;max-width:640px;margin:0 auto}
.resumen{display:flex;gap:10px;margin-bottom:14px}
.resumen div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.resumen b{font-family:Fraunces,serif;font-size:1.7rem;display:block;line-height:1}
.resumen span{font-size:.78rem;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:62px 1fr;gap:12px}
.card.ASISTIÓ{border-left-color:var(--ok);opacity:.78}.card.NOASISTIÓ{border-left-color:var(--bad);opacity:.7}
.hora{font-family:Fraunces,serif;font-size:1.35rem;font-weight:700;color:var(--navy);line-height:1.1}
.nom{font-weight:600;font-size:1.02rem}.mot{font-size:.85rem;color:var(--mute);margin-top:2px}
.nota{font-size:.82rem;background:#FAF7EE;border-radius:8px;padding:6px 8px;margin-top:8px}
.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:6px;background:#FEF3C7;color:#92400E}
.ASISTIÓ .badge{background:#D1FAE5;color:#065F46}.NOASISTIÓ .badge{background:#FEE2E2;color:#991B1B}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.acts a,.acts button{flex:1 1 auto;text-align:center;text-decoration:none;font:600 .8rem Inter,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.acts .ok{background:var(--ok);color:#fff;border:0}.acts .no{color:var(--bad)}
.vacio{text-align:center;color:var(--mute);padding:50px 20px}.vacio .serif{font-size:1.3rem;color:var(--navy);display:block;margin-bottom:6px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--navy);color:var(--gold);border:2px solid var(--gold);border-radius:30px;padding:15px 22px;font:600 .95rem Inter,sans-serif;box-shadow:0 10px 25px rgba(10,25,47,.35)}
dialog{border:0;border-radius:20px;width:min(480px,94vw);padding:22px;margin:auto}
dialog::backdrop{background:rgba(10,25,47,.6)}
dialog h2{font-size:1.4rem;margin-bottom:14px;color:var(--navy)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:500 1rem Inter,sans-serif;background:#FDFCF9}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
.row{display:flex;gap:10px;margin-top:18px}.row button{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:600 .95rem Inter,sans-serif}
.row .pri{background:var(--navy);color:var(--gold);border-color:var(--navy)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:.9rem;z-index:50;transition:transform .35s;max-width:92vw;border-left:4px solid var(--gold)}
#toast.on{transform:translateX(-50%) translateY(0)}
#login{position:fixed;inset:0;background:var(--navy);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
#login .box{background:#fff;border-radius:20px;padding:26px;width:min(400px,100%)}
#instalar{display:none;background:var(--gold);color:var(--navy);border:0;border-radius:12px;padding:10px 14px;font:600 .82rem Inter,sans-serif;margin-top:12px;width:100%}
/* ===== CAPA PRO ===== */
#splash{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#172A45,#050d1a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
#splash.fuera{opacity:0;transform:scale(1.08);pointer-events:none}
#splash svg{width:124px;color:var(--gold);filter:drop-shadow(0 0 14px rgba(212,175,55,.45))}
#splash svg ellipse,#splash svg path{stroke-dasharray:200;stroke-dashoffset:200;animation:trazo 1.4s cubic-bezier(.65,0,.35,1) forwards}
#splash svg ellipse:nth-of-type(2){animation-delay:.2s}#splash svg path{animation-delay:.5s}
#splash h2{font-family:Fraunces,serif;font-size:1.7rem;letter-spacing:8px;margin:18px 0 0 8px;opacity:0;animation:sube .8s .9s forwards}
#splash p{font-size:.72rem;letter-spacing:4px;color:var(--gold);opacity:0;animation:sube .8s 1.2s forwards;margin-top:6px}
#splash .barra{width:140px;height:2px;background:rgba(255,255,255,.12);margin-top:28px;border-radius:2px;overflow:hidden}
#splash .barra i{display:block;height:100%;width:40%;background:var(--gold);animation:carga 1.1s ease-in-out infinite}
@keyframes trazo{to{stroke-dashoffset:0}}@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes carga{from{transform:translateX(-100%)}to{transform:translateX(260%)}}@keyframes shimmer{to{background-position:-200% 0}}
.card{animation:sube .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms);transition:opacity .3s,border-color .3s}
.resumen div{animation:sube .5s both}.resumen div:nth-child(2){animation-delay:.06s}.resumen div:nth-child(3){animation-delay:.12s}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;animation:sube .5s both;border:1px solid rgba(212,175,55,.35)}
.hero::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);animation:destello 4s 1s infinite}
@keyframes destello{0%,55%{left:-60%}100%{left:130%}}
.hero small{color:var(--gold);font-size:.75rem;letter-spacing:1px}.hero .hh{font-family:Fraunces,serif;font-size:2rem;font-weight:700;margin:4px 0}
.hero .chip{display:inline-block;background:var(--gold);color:var(--navy);font-weight:600;font-size:.78rem;padding:4px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.hero .chip.ya{animation:latido 1.4s infinite}@keyframes latido{50%{transform:scale(1.08)}}
.hero a{display:inline-block;margin-top:12px;color:var(--navy);background:#fff;text-decoration:none;font-weight:600;font-size:.82rem;padding:9px 14px;border-radius:10px}
.skel{height:96px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,#ece7da 25%,#f8f5ee 50%,#ece7da 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
dialog[open]{animation:hoja .42s cubic-bezier(.2,.9,.3,1.1)}@keyframes hoja{from{transform:translateY(50px);opacity:0}}
@media(max-width:600px){dialog{margin:auto auto 0;border-radius:24px 24px 0 0;width:100%;max-width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
.day{transition:transform .2s,background .3s,color .3s}.day:active,.acts a:active,.acts button:active,.row button:active,.fab:active{transform:scale(.95)}
.fab{transition:transform .2s;animation:sube .6s .3s both}
#toast button{margin-left:12px;background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:5px 10px;font-weight:600}
@media(prefers-color-scheme:dark){:root{--bg:#0B1324;--card:#121C30;--ink:#E5E9F0;--mute:#93A1B5;--line:#24324C}
 .nota{background:#1A2640}input,select,textarea{background:#0F1828;color:var(--ink)}dialog,#login .box{background:var(--card);color:var(--ink)}
 .acts a,.acts button,.row button{background:var(--card);color:var(--ink)}.hora,dialog h2{color:var(--gold)}
 .skel{background:linear-gradient(90deg,#16223A 25%,#1E2C47 50%,#16223A 75%);background-size:200% 100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
#buscar{margin-top:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:11px 14px;font-size:.9rem;border-radius:12px}
#buscar::placeholder{color:#94A3B8}#buscar:focus{border-color:var(--gold);background:rgba(255,255,255,.14)}
.card.PENDIENTE{touch-action:pan-y}
.tip{font-size:.75rem;color:var(--mute);text-align:center;margin:-4px 0 12px}
</style>
</head>
<body>
<div id="splash"><canvas id="splashFx" style="position:absolute;inset:0;width:100%;height:100%"></canvas><svg viewBox="0 0 120 70" fill="none" stroke="currentColor"><ellipse cx="40" cy="35" rx="25" ry="20" stroke-width="2.4"/><ellipse cx="80" cy="35" rx="25" ry="20" stroke-width="2.4"/><path d="M 55 32 Q 60 26 65 32 M 22 25 L 12 25 M 98 25 L 108 25" stroke-width="2.4" stroke-linecap="round"/></svg><h2 style="position:relative">RG ÓPTICAS</h2><p>AGENDA CLÍNICA</p><div class="barra"><i></i></div></div>
<div id="login"><div class="box"><h2 class="serif" style="font-size:1.6rem;color:var(--gold)">Agenda RG Ópticas</h2>
<label>Correo</label><input id="lgMail" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<label>Contraseña</label><input id="lgPass" type="password" autocomplete="current-password">
<div class="row"><button class="pri" onclick="entrar()">Entrar</button></div><p id="lgErr" style="color:var(--bad);font-size:.85rem;margin-top:10px"></p></div></div>

<header>
  <div class="top"><div><h1>Agenda de Citas</h1><div class="sub" id="fechaLarga"></div></div>
  <div class="icons"><button id="btnBell" onclick="pedirAvisos()" title="Activar avisos">🔔</button><button onclick="irHoy()" title="Ir a hoy">⌂</button></div></div>
  <div class="strip" id="strip"></div>
  <input id="buscar" type="search" placeholder="🔍  Buscar paciente o teléfono en toda la agenda" oninput="buscar(this.value)" autocomplete="off">
  <button id="instalar" onclick="instalarApp()">📲 Instalar en este celular</button>
</header>
<main>
  <div id="hero"></div>
  <div class="resumen"><div><b id="nTotal">0</b><span>citas del día</span></div><div><b id="nPend">0</b><span>por atender</span></div><div><b id="nAt">0</b><span>atendidas</span></div></div>
  <div class="tip">Desliza una cita → asistió · ← no asistió</div>
  <div id="lista"></div>
</main>
<button class="fab" onclick="abrirNueva()">+ Nueva cita</button>

<dialog id="dNueva"><h2>Nueva cita</h2>
  <label>Paciente *</label><input id="fNom" autocomplete="off">
  <label>Teléfono / WhatsApp *</label><input id="fTel" type="tel" inputmode="tel">
  <label>Fecha y hora *</label><input id="fFh" type="datetime-local">
  <label>Motivo</label><select id="fMot"><option>Examen de la Vista General</option><option>Adaptación de Lentes de Contacto</option><option>Topografía Corneal</option><option>Entrega de Anteojos</option><option>Garantía / Reparación</option></select>
  <label>Notas</label><textarea id="fNot" rows="2"></textarea>
  <div class="row"><button onclick="dNueva.close()">Cancelar</button><button class="pri" id="btnGuardar" onclick="guardarNueva()">Agendar</button></div></dialog>

<dialog id="dRea"><h2>Reagendar</h2><label>Nueva fecha y hora</label><input id="rFh" type="datetime-local"><input type="hidden" id="rId">
  <div class="row"><button onclick="dRea.close()">Cancelar</button><button class="pri" onclick="guardarRea()">Guardar</button></div></dialog>
<div id="toast"></div>

<script>
// ===== CAPA PRO: SPLASH, PRÓXIMA CITA, CONTADORES Y DESHACER =====
let cargado=false;
const t0Splash=Date.now();
function quitarSplash(){const s=$('splash');if(!s||s.classList.contains('fuera'))return;setTimeout(()=>{s.classList.add('fuera');setTimeout(()=>s.remove(),700)},Math.max(0,1700-(Date.now()-t0Splash)))}
setTimeout(quitarSplash,4500);
function contarNum(el,v){const de=+el.textContent||0,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/500);el.textContent=Math.round(de+(v-de)*k);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function msgWA(c){const f=new Date(c.fechaHora);return `Hola ${c.paciente||''}, le saludamos de RG Ópticas. Le confirmamos su cita de ${c.motivo||'consulta'} el ${f.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} a las ${c.fechaHora.slice(11,16)} h. ¿Nos confirma su asistencia? 👓`}
function linkWA(c){const tel=String(c.telefono||'').replace(/\D/g,'');return tel?`https://wa.me/${tel.length===10?'52'+tel:tel}?text=${encodeURIComponent(msgWA(c))}`:''}
function pintarHero(){
  const h=$('hero');if(!h)return;const ahora=new Date(),k=ymd(ahora)+'T'+p2(ahora.getHours())+':'+p2(ahora.getMinutes());
  const sig=citas.filter(c=>(c.estado||'PENDIENTE')==='PENDIENTE'&&(c.fechaHora||'')>=k.slice(0,14)+'00'&&c.fechaHora>=ymd(ahora)).sort((a,b)=>a.fechaHora.localeCompare(b.fechaHora)).find(c=>new Date(c.fechaHora)>=new Date(ahora-15*60000));
  if(!sig){h.innerHTML='';return}
  const min=Math.round((new Date(sig.fechaHora)-ahora)/60000);
  const falta=min<=0?'Ahora':min<60?`en ${min} min`:min<1440?`en ${Math.floor(min/60)} h ${min%60} min`:new Date(sig.fechaHora).toLocaleDateString('es-MX',{weekday:'short',day:'numeric'});
  const wa=linkWA(sig);
  h.innerHTML=`<div class="hero"><small>Siguiente cita</small><div class="hh">${esc(sig.fechaHora.slice(11,16))}<span class="chip ${min<=15?'ya':''}">${esc(falta)}</span></div><div style="font-weight:600">${esc(sig.paciente)}</div><div style="font-size:.85rem;color:#B6C2D6">${esc(sig.motivo||'')}</div>${wa?`<a href="${wa}" target="_blank" rel="noopener">Enviar confirmación por WhatsApp</a>`:''}</div>`;
}
setInterval(()=>{if(cargado)pintarHero()},30000);
function toastDeshacer(m,fn){const t=$('toast');t.innerHTML='';t.append(m);const b=document.createElement('button');b.textContent='Deshacer';b.onclick=()=>{fn();t.classList.remove('on')};t.append(b);t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),5000)}

// ===== CAPA PRO 2: PARTÍCULAS EN ARRANQUE, BÚSQUEDA Y GESTOS DE DESLIZAR =====
(function(){
  const cv=document.getElementById('splashFx'); if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let W,H;
  const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const ps=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.4,v:Math.random()*.6+.2,f:Math.random()*6}));
  let chis=[];setTimeout(()=>{for(let i=0;i<60;i++){const a=Math.random()*6.28,s=Math.random()*5+1;chis.push({x:W/2,y:H/2-40,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}},1100);
  (function f(){if(!document.getElementById('splash'))return;requestAnimationFrame(f);ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    ps.forEach(p=>{p.y-=p.v;p.f+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}ctx.globalAlpha=.4+.4*Math.sin(p.f);ctx.fillStyle='#D4AF37';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()});
    chis=chis.filter(c=>(c.l-=.02)>0);chis.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vx*=.95;c.vy=c.vy*.95+.05;ctx.globalAlpha=c.l;ctx.fillStyle='#FFE58F';ctx.beginPath();ctx.arc(c.x,c.y,2*c.l+.4,0,6.28);ctx.fill()});ctx.globalAlpha=1})();
})();
let busq='';
const normA=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function buscar(v){busq=normA(v.trim());pintar()}
// Deslizar tarjeta: derecha = Asistió, izquierda = No asistió
(function(){
  let card=null,x0=0,y0=0,dx=0,horizontal=null;
  document.addEventListener('touchstart',e=>{const c=e.target.closest('.card.PENDIENTE');if(!c||e.target.closest('a,button'))return;card=c;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;horizontal=null;c.style.transition='none'},{passive:true});
  document.addEventListener('touchmove',e=>{if(!card)return;const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
    if(horizontal===null&&(Math.abs(mx)>8||Math.abs(my)>8))horizontal=Math.abs(mx)>Math.abs(my);
    if(!horizontal)return;dx=mx;card.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;
    card.style.boxShadow=dx>0?`inset 6px 0 0 var(--ok), 0 0 0 2px rgba(4,120,87,${Math.min(.5,dx/200)})`:`inset -6px 0 0 var(--bad), 0 0 0 2px rgba(185,28,28,${Math.min(.5,-dx/200)})`},{passive:true});
  document.addEventListener('touchend',()=>{if(!card)return;const c=card;card=null;c.style.transition='transform .3s, box-shadow .3s, opacity .3s';
    if(horizontal&&Math.abs(dx)>100){c.style.transform=`translateX(${dx>0?120:-120}%)`;c.style.opacity='0';setTimeout(()=>estado(c.dataset.id,dx>0?'ASISTIÓ':'NO ASISTIÓ'),250)}
    else{c.style.transform='';c.style.boxShadow=''}});
})();

// ===== CONFIGURACIÓN =====
const USAR_LOGIN = true; // true cuando actives Firebase Authentication y endurezcas las reglas de Firestore
const ESPECIALISTA = 'María Patricia Rojas Centeno';
firebase.initializeApp({apiKey:"AIzaSyBgtC6qexBlnS_mQTVkZ19ueKgZIOrgRnk",authDomain:"optica-rg--2.firebaseapp.com",projectId:"optica-rg--2",storageBucket:"optica-rg--2.firebasestorage.app",messagingSenderId:"786320956490",appId:"1:786320956490:web:19b7a390ead756327b1ab3"});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

// ===== UTILIDADES =====
const $ = id => document.getElementById(id), p2 = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
let citas=[], sel=ymd(new Date()), primera=true;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3500)}
const estadoKey = e => (e||'PENDIENTE').replace(/\s/g,'');

// ===== TIRA DE DÍAS =====
function pintarTira(){
  const base=new Date(); base.setHours(12); let h='';
  for(let i=-1;i<14;i++){const d=new Date(base);d.setDate(base.getDate()+i);const k=ymd(d);
    const tiene=citas.some(c=>(c.fechaHora||'').startsWith(k)&&c.estado!=='CANCELADA');
    h+=`<button class="day ${k===sel?'sel':''} ${tiene?'has':''}" onclick="elegir('${k}')"><small>${DIAS[d.getDay()]}</small><b>${d.getDate()}</b><i></i></button>`;}
  $('strip').innerHTML=h;
  const f=new Date(sel+'T12:00');$('fechaLarga').textContent=f.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
}
function elegir(k){sel=k;busq='';$('buscar').value='';pintar()}
function irHoy(){sel=ymd(new Date());pintar();$('strip').scrollLeft=0}

// ===== LISTA =====
function pintar(){
  pintarTira();
  const del=busq?citas.filter(c=>normA(c.paciente+' '+c.telefono+' '+c.motivo).includes(busq)).slice(-40).reverse():citas.filter(c=>(c.fechaHora||'').startsWith(sel)).sort((a,b)=>a.fechaHora.localeCompare(b.fechaHora));
  if(!cargado){$('lista').innerHTML='<div class="skel"></div>'.repeat(3);return}
  pintarHero(); contarNum($('nTotal'),del.length); contarNum($('nPend'),del.filter(c=>(c.estado||'PENDIENTE')==='PENDIENTE').length); contarNum($('nAt'),del.filter(c=>c.estado==='ASISTIÓ').length);
  if(!del.length){$('lista').innerHTML=busq?'<div class="vacio"><span class="serif">Sin resultados</span>Prueba con otro nombre o número.</div>':'<div class="vacio"><span class="serif">Día libre</span>No hay citas para esta fecha.</div>';return}
  $('lista').innerHTML=del.map((c,i)=>{
    const k=estadoKey(c.estado), tel=String(c.telefono||'').replace(/\D/g,''), wa=tel.length===10?'52'+tel:tel;
    const pend=(c.estado||'PENDIENTE')==='PENDIENTE';
    return `<div class="card ${k}" data-id="${c.id}" style="--i:${i}"><div class="hora">${busq?esc(c.fechaHora.slice(8,10)+"/"+c.fechaHora.slice(5,7))+"<small style=\"display:block;font-size:.8rem;color:var(--mute)\">"+esc(c.fechaHora.slice(11,16))+"</small>":esc(c.fechaHora.slice(11,16))}</div>
    <div><div class="nom">${esc(c.paciente)}</div><div class="mot">${esc(c.motivo||'')}</div><span class="badge">${esc(c.estado||'PENDIENTE')}</span>
    ${c.notas?`<div class="nota">${esc(c.notas)}</div>`:''}</div>
    <div class="acts">${tel?`<a href="tel:${esc(tel)}">Llamar</a><a href="${linkWA(c)}" target="_blank" rel="noopener">Confirmar por WhatsApp</a>`:''}
    ${pend?`<button class="ok" onclick="estado('${c.id}','ASISTIÓ')">Asistió</button><button class="no" onclick="estado('${c.id}','NO ASISTIÓ')">No asistió</button>`:`<button onclick="estado('${c.id}','PENDIENTE')">Deshacer</button>`}
    <button onclick="abrirRea('${c.id}')">Reagendar</button></div></div>`}).join('');
}

// ===== DATOS EN TIEMPO REAL =====
function iniciarDatos(){
  db.collection('citas').orderBy('fechaHora','asc').onSnapshot(snap=>{
    citas=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!primera && !snap.metadata.hasPendingWrites) snap.docChanges().forEach(ch=>{ if(ch.type==='added'&&!ch.doc.metadata.hasPendingWrites){ avisoNueva(ch.doc.data()) } });
    primera=false; cargado=true; pintar(); quitarSplash();
  },e=>{toast('Sin conexión con la nube: '+e.message);cargado=true;pintar();quitarSplash()});
}
function estado(id,e){const c=citas.find(x=>x.id===id),antes=(c&&c.estado)||'PENDIENTE';if(navigator.vibrate)navigator.vibrate(30);
  db.collection('citas').doc(id).update({estado:e}).then(()=>toastDeshacer(`Marcada: ${e}`,()=>db.collection('citas').doc(id).update({estado:antes}))).catch(x=>toast(x.message))}

// ===== NUEVA CITA / REAGENDAR =====
const dNueva=$('dNueva'), dRea=$('dRea');
function abrirNueva(){['fNom','fTel','fNot'].forEach(i=>$(i).value='');$('fFh').value=sel+'T09:00';$('btnGuardar').disabled=false;dNueva.showModal()}
function ocupada(fh,excluir){return citas.some(c=>c.fechaHora===fh&&c.id!==excluir&&(c.estado||'PENDIENTE')==='PENDIENTE')}
async function guardarNueva(){
  const nom=$('fNom').value.trim(),tel=$('fTel').value.trim(),fh=$('fFh').value;
  if(!nom||!tel||!fh)return toast('Completa paciente, teléfono y fecha.');
  if(ocupada(fh)&&!confirm('Ya hay una cita a esa hora. ¿Agendar de todos modos?'))return;
  $('btnGuardar').disabled=true;
  try{await db.collection('citas').add({folio:'CIT-'+Date.now().toString().slice(-6),paciente:nom,telefono:tel,fechaHora:fh,motivo:$('fMot').value,especialista:ESPECIALISTA,notas:$('fNot').value.trim(),estado:'PENDIENTE',creado:Date.now(),origen:'app-doctora'});
    dNueva.close();sel=fh.slice(0,10);pintar();toast('Cita agendada ✓')}
  catch(e){toast('Error: '+e.message);$('btnGuardar').disabled=false}
}
function abrirRea(id){const c=citas.find(x=>x.id===id);$('rId').value=id;$('rFh').value=c?c.fechaHora:'';dRea.showModal()}
async function guardarRea(){
  const id=$('rId').value,fh=$('rFh').value;if(!fh)return;
  if(ocupada(fh,id)&&!confirm('Ya hay una cita a esa hora. ¿Mover de todos modos?'))return;
  try{await db.collection('citas').doc(id).update({fechaHora:fh,estado:'PENDIENTE'});dRea.close();sel=fh.slice(0,10);pintar();toast('Cita reagendada ✓')}catch(e){toast(e.message)}
}

// ===== AVISOS (funcionan con la app abierta o en segundo plano reciente) =====
function pedirAvisos(){
  if(!('Notification' in window))return toast('Este navegador no soporta avisos.');
  Notification.requestPermission().then(r=>toast(r==='granted'?'Avisos activados 🔔':'Avisos no permitidos'));
}
function avisoNueva(c){
  const msg=`Nueva cita: ${c.paciente} · ${String(c.fechaHora||'').replace('T',' ')}`;
  toast(msg); if(navigator.vibrate)navigator.vibrate([200,100,200]);
  if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification('Agenda RG Ópticas',{body:msg,icon:'icon-192.png',badge:'icon-192.png'}));
}

// ===== INSTALACIÓN PWA =====
let promptInst=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInst=e;$('instalar').style.display='block'});
function instalarApp(){if(promptInst){promptInst.prompt();promptInst=null;$('instalar').style.display='none'}}
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone){$('instalar').style.display='block';$('instalar').textContent='iPhone: toca Compartir ⬆ y "Añadir a pantalla de inicio"';$('instalar').onclick=null}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// ===== ARRANQUE / LOGIN =====
function entrar(){firebase.auth().signInWithEmailAndPassword($('lgMail').value.trim().toLowerCase(),$('lgPass').value).catch(e=>$('lgErr').textContent=(c=>({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'Ese correo no está registrado en Firebase.','auth/invalid-email':'El correo no tiene un formato válido.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin conexión a internet.','auth/operation-not-allowed':'El acceso con correo no está activado en Firebase.','auth/user-disabled':'Esta cuenta está desactivada.'}[c]||('Error: '+c)))(e.code))}
if(USAR_LOGIN){$('login').style.display='flex';firebase.auth().onAuthStateChanged(u=>{if(u){$('login').style.display='none';iniciarDatos()}else $('login').style.display='flex'})}
else iniciarDatos();
pintar();
</script>
